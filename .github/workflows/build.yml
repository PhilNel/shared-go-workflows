name: Build

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        type: string
        default: "1.24"
      working-directory:
        required: false
        type: string
        default: "."
      skip-cache:
        required: false
        type: boolean
        default: false
      build-targets:
        required: false
        type: string
        default: "linux/amd64"
      build-cmd-dir:
        required: true
        type: string
      binary-name:
        required: false
        type: string
        default: "bootstrap"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Tidy dependencies
        working-directory: ${{ inputs.working-directory }}
        run: go mod tidy

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o ${{ inputs.binary-name }} ./${{ inputs.build-cmd-dir }}
